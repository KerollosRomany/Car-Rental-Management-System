<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile | Wayfare staff</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/img/logo-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="theme-light" data-layout="admin" data-base="../" data-page="profile" data-title="My profile">
  <div class="admin">
    <aside id="admin-sidebar" aria-label="Staff navigation"></aside>
    <div class="admin-main">
      <header id="admin-topbar"></header>

      <main class="admin-content" id="main">
        <div class="page-head">
          <div>
            <h1>My profile</h1>
            <p>Your staff account. Customers see your name on the rentals you handle.</p>
          </div>
        </div>

        <div class="profile-grid">
          <aside class="card card-pad profile-card" id="profile-card" aria-label="Account summary"></aside>

          <div class="stack" style="--stack-gap:24px">
            <!-- Backend: PUT /api/profile -->
            <form class="card form-card" id="form-personal" novalidate>
              <div class="card-head"><div><h3>Personal details</h3><p>Used to log in and to reach you about rentals.</p></div></div>
              <div class="card-body">
                <div class="form-grid">
                  <div class="field span-2">
                    <label class="label" for="a-name">Full name</label>
                    <input class="input" id="a-name" name="name" type="text" autocomplete="name" required>
                  </div>
                  <div class="field">
                    <label class="label" for="a-email">Email</label>
                    <input class="input" id="a-email" name="email" type="email" autocomplete="email" required>
                  </div>
                  <div class="field">
                    <label class="label" for="a-phone">Phone</label>
                    <input class="input" id="a-phone" name="phone" type="tel" autocomplete="tel" pattern="[0-9+\s\-]{8,16}" data-msg-pattern="Enter a phone number with 8 to 16 digits." required>
                  </div>
                </div>
              </div>
              <div class="card-foot"><button class="btn btn-dark" type="submit">Save changes</button></div>
            </form>

            <!-- Backend: PUT /api/profile/password -->
            <form class="card form-card" id="form-password" novalidate>
              <div class="card-head"><div><h3>Password</h3><p>Use at least 8 characters.</p></div></div>
              <div class="card-body">
                <div class="form-grid">
                  <div class="field span-2">
                    <label class="label" for="pw-current">Current password</label>
                    <div class="input-wrap has-action">
                      <i class="ph ph-lock-simple" aria-hidden="true"></i>
                      <input class="input" id="pw-current" name="current" type="password" autocomplete="current-password" required>
                      <button class="input-action" type="button" data-toggle-password aria-label="Show password"><i class="ph ph-eye" aria-hidden="true"></i></button>
                    </div>
                  </div>
                  <div class="field">
                    <label class="label" for="pw-new">New password</label>
                    <div class="input-wrap has-action">
                      <i class="ph ph-lock-simple" aria-hidden="true"></i>
                      <input class="input" id="pw-new" name="password" type="password" autocomplete="new-password" minlength="8" required>
                      <button class="input-action" type="button" data-toggle-password aria-label="Show password"><i class="ph ph-eye" aria-hidden="true"></i></button>
                    </div>
                  </div>
                  <div class="field">
                    <label class="label" for="pw-confirm">Confirm new password</label>
                    <div class="input-wrap has-action">
                      <i class="ph ph-lock-simple" aria-hidden="true"></i>
                      <input class="input" id="pw-confirm" name="confirm" type="password" autocomplete="new-password" data-match="#pw-new" required>
                      <button class="input-action" type="button" data-toggle-password aria-label="Show password"><i class="ph ph-eye" aria-hidden="true"></i></button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="card-foot"><button class="btn btn-dark" type="submit">Update password</button></div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/render.js"></script>
  <script src="../assets/js/pages/admin-profile.js"></script>
</body>
</html>
