<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login | Wayfare</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-layout="none" data-page="staff-login" data-base="../">
  <main class="auth is-admin" id="main">
    <section class="auth-visual" style="background-image:url('https://images.unsplash.com/photo-1653227158553-ddaa680cdd65?auto=format&fit=crop&w=1400&q=80')">
      <a class="brand" href="../index.html" aria-label="Wayfare home"><img class="brand-mark" src="../assets/img/logo-mark.svg" alt="" width="36" height="36"><span class="brand-word">Wayfare</span></a>
      <div>
        <h1>Keep the fleet <em>moving</em></h1>
        <p>Approve requests, hand over keys, record returns and keep every payment in one place.</p>
        <ul class="perk-list">
          <li><i class="ph ph-car-profile" aria-hidden="true"></i>Manage the fleet</li>
          <li><i class="ph ph-key" aria-hidden="true"></i>Handle rentals</li>
          <li><i class="ph ph-users-three" aria-hidden="true"></i>Look after customers</li>
          <li><i class="ph ph-receipt" aria-hidden="true"></i>Record payments</li>
        </ul>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <a class="brand auth-mobile-brand" href="../index.html" aria-label="Wayfare home"><img class="brand-mark" src="../assets/img/logo-mark.svg" alt="" width="36" height="36"><span class="brand-word">Wayfare</span></a>
        <h2>Staff login</h2>
        <p class="sub">Sign in to the staff console.</p>

        <!-- Backend: set action to the staff login endpoint and method="post". -->
        <form data-auth-form="staff" action="index.html" method="post" novalidate>
          <div class="field">
            <label class="label" for="email">Work email</label>
            <div class="input-wrap">
              <i class="ph ph-envelope-simple" aria-hidden="true"></i>
              <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="name@wayfare.test" required>
            </div>
          </div>

          <div class="field">
            <label class="label" for="password">Password</label>
            <div class="input-wrap has-action">
              <i class="ph ph-lock-simple" aria-hidden="true"></i>
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" minlength="8" required>
              <button class="input-action" type="button" data-toggle-password aria-label="Show password"><i class="ph ph-eye" aria-hidden="true"></i></button>
            </div>
          </div>

          <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
        </form>

        <p class="auth-foot"><a class="link" href="../login.html">Back to customer login</a></p>
      </div>
    </section>
  </main>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
</body>
</html>
