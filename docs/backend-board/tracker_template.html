<title>Wayfare Backend Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Design plan. Palette: Cloud Cobalt. A light page with white panels, one cobalt for every action, deep navy for the brand bar and code, and plain semantic colours for status.
   Type: Archivo (wide, for titles and numbers), Geist (text), Geist Mono (codes, hours, routes).
   Layout: a navy brand bar with the Wayfare plate, a summary card, tabs, then one working surface per tab. Packages are the home view. Cards open in a side drawer that holds the full spec. */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-2: #eef2fa;
  --ink: #0c1430;
  --ink-2: #3b4666;
  --ink-3: #5a6586;
  --line: #dde3f0;
  --line-2: #c4cde2;
  --accent: #2447f0;
  --accent-hover: #3a5cf8;
  --accent-ink: #ffffff;
  --accent-text: #1c3bd0;
  --accent-soft: rgba(36, 71, 240, 0.09);
  --accent-line: rgba(36, 71, 240, 0.45);
  --ok: #12603a; --ok-bg: #e2f3ea;
  --warn: #7a5200; --warn-bg: #fbf0d6;
  --bad: #a12c1e; --bad-bg: #fbe4e0;
  --info: #1d4c99; --info-bg: #e3ebfa;
  --brand-bg: #0a1230;
  --brand-ink: #f2f5ff;
  --brand-ink-2: #aab6dd;
  --brand-line: #2a3566;
  --stitch: #6b86ff;
  --code-bg: #0a1230;
  --code-ink: #e6ebff;
  --scrim: rgba(6, 12, 34, 0.55);
  --shadow: 0 1px 2px rgba(12, 20, 48, 0.06), 0 12px 30px rgba(12, 20, 48, 0.10);
  --font-display: "Archivo", "Geist", system-ui, sans-serif;
  --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070c1f; --surface: #0d1533; --surface-2: #131c40; --ink: #eef2ff; --ink-2: #b9c2e0; --ink-3: #8f9ac0;
    --line: #1d2850; --line-2: #2c3b70; --accent: #4f6dff; --accent-hover: #6b86ff; --accent-ink: #ffffff; --accent-text: #9fb2ff;
    --accent-soft: rgba(95, 124, 255, 0.16); --accent-line: rgba(130, 156, 255, 0.5);
    --ok: #86d9ab; --ok-bg: rgba(86, 190, 137, 0.14); --warn: #ebc274; --warn-bg: rgba(222, 170, 70, 0.16);
    --bad: #f5a193; --bad-bg: rgba(228, 96, 76, 0.16); --info: #a3c1f5; --info-bg: rgba(100, 148, 224, 0.16);
    --brand-bg: #050a1a; --brand-line: #1d2850; --code-bg: #060b1e; --scrim: rgba(0, 0, 0, 0.68);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 14px 34px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070c1f; --surface: #0d1533; --surface-2: #131c40; --ink: #eef2ff; --ink-2: #b9c2e0; --ink-3: #8f9ac0;
  --line: #1d2850; --line-2: #2c3b70; --accent: #4f6dff; --accent-hover: #6b86ff; --accent-ink: #ffffff; --accent-text: #9fb2ff;
  --accent-soft: rgba(95, 124, 255, 0.16); --accent-line: rgba(130, 156, 255, 0.5);
  --ok: #86d9ab; --ok-bg: rgba(86, 190, 137, 0.14); --warn: #ebc274; --warn-bg: rgba(222, 170, 70, 0.16);
  --bad: #f5a193; --bad-bg: rgba(228, 96, 76, 0.16); --info: #a3c1f5; --info-bg: rgba(100, 148, 224, 0.16);
  --brand-bg: #050a1a; --brand-line: #1d2850; --code-bg: #060b1e; --scrim: rgba(0, 0, 0, 0.68);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 14px 34px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--accent-text); }
code, pre, .mono { font-family: var(--font-mono); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 1360px; margin-inline: auto; padding-inline: max(16px, 3vw); }
[hidden] { display: none !important; }

/* ---------- brand bar ---------- */
.top { position: relative; background: var(--brand-bg); color: var(--brand-ink); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--stitch) 0 9px, transparent 9px 15px); opacity: 0.9; }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 68px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand svg { flex: none; height: 34px; width: auto; display: block; }
.brand h1 { font: 500 15px/1.2 var(--font-body); color: var(--brand-ink-2); padding-left: 16px; border-left: 1px solid var(--brand-line); }
.grow { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--brand-ink-2); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #5d6a99; }
.live.on i { background: #4fd49a; box-shadow: 0 0 0 3px rgba(79, 212, 154, 0.2); }
.live.ro i { background: #e0b24a; }
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 7px 14px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.mini { min-height: 30px; padding: 3px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.top .btn { background: transparent; border-color: var(--brand-line); color: var(--brand-ink); }
.top .btn:hover { border-color: #5d6a99; }
.me { display: inline-flex; align-items: center; gap: 9px; }

/* ---------- avatars ---------- */
.av { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font: 600 10.5px/1 var(--font-body); letter-spacing: 0.02em; color: #fff; flex: none; }
.av.lg { width: 34px; height: 34px; font-size: 12px; }
.av0 { background: #2447f0; } .av1 { background: #0a7f92; } .av2 { background: #6b3fd4; } .av3 { background: #b02a78; }
.av4 { background: #1f7a4d; } .av5 { background: #4a5570; } .av6 { background: #8a6d00; }

/* ---------- summary ---------- */
.sum { margin-top: 24px; padding: 24px 26px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr); gap: 20px 44px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.sum .lede { color: var(--ink-2); max-width: 54ch; margin-top: 8px; }
.sum h2 { font-size: 28px; font-weight: 700; font-stretch: 114%; letter-spacing: -0.01em; margin-top: 4px; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big strong { font: 700 46px/1 var(--font-display); font-stretch: 125%; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.big span { color: var(--ink-2); }
.meter { display: flex; height: 10px; margin-top: 12px; border-radius: 3px; overflow: hidden; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.meter i { display: block; height: 100%; }
.meter .m-done { background: var(--ok); } .meter .m-review { background: var(--info); } .meter .m-doing { background: var(--accent); }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.counts b { font-variant-numeric: tabular-nums; color: var(--ink); }
.counts .late b { color: var(--bad); }
.people { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.person { display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px 4px 4px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); font-size: 13px; cursor: pointer; }
.person:hover { border-color: var(--line-2); }
.person[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.person small { color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line-2); margin-top: 22px; scrollbar-width: thin; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 12px 16px 11px; font-weight: 600; color: var(--ink-3); white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { margin-left: 7px; padding: 1px 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font: 500 11px var(--font-mono); color: var(--ink-3); }
main { padding-block: 24px 64px; min-height: 60vh; }

/* ---------- shared bits ---------- */
.m { display: inline-block; padding: 3px 7px 2px; border-radius: 3px; font: 600 11px/1.3 var(--font-mono); letter-spacing: 0.04em; }
.m-get { background: var(--ok-bg); color: var(--ok); } .m-post { background: var(--accent-soft); color: var(--accent-text); }
.m-put { background: var(--info-bg); color: var(--info); } .m-delete { background: var(--bad-bg); color: var(--bad); }
.st { display: inline-block; padding: 3px 8px 2px; border-radius: 3px; font: 600 11px/1.3 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.st-todo { background: var(--surface-2); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.st-doing { background: var(--accent-soft); color: var(--accent-text); } .st-review { background: var(--info-bg); color: var(--info); } .st-done { background: var(--ok-bg); color: var(--ok); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.chip.warn { background: var(--warn-bg); color: var(--warn); box-shadow: none; } .chip.bad { background: var(--bad-bg); color: var(--bad); box-shadow: none; }
.chip.ok { background: var(--ok-bg); color: var(--ok); box-shadow: none; } .chip.acc { background: var(--accent-soft); color: var(--accent-text); box-shadow: none; }
button.chip { cursor: pointer; border: 0; font-family: inherit; }
button.chip:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.code { display: inline-block; padding: 2px 6px; border-radius: 3px; background: var(--ink); color: var(--bg); font: 600 11px/1.4 var(--font-mono); }
.size { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line-2); font: 600 11px/1 var(--font-mono); color: var(--ink-2); }
.muted { color: var(--ink-3); }
.eyebrow { font: 600 11px/1.3 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-text); }
.empty { padding: 36px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--ink-2); }
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; padding: 6px 10px 6px 0; font: 600 11px/1.3 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.t td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.t td:first-child { font-weight: 600; }
.t code { font-size: 12px; overflow-wrap: anywhere; }
.sect { display: grid; gap: 12px; }
.sect > h3 { font-size: 18px; font-stretch: 110%; }
.sect > p.lead { color: var(--ink-2); max-width: 70ch; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid > .panel { align-self: start; }
@media (max-width: 860px) { .g2, .g3, .sum { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
pre.json { margin: 0; padding: 12px 14px; max-height: 360px; overflow: auto; border-radius: 4px; background: var(--code-bg); color: var(--code-ink); font: 12.5px/1.55 var(--font-mono); }
ol.rules { padding-left: 22px; display: grid; gap: 6px; }
ul.plain { list-style: none; display: grid; gap: 5px; }
ul.plain li { padding-left: 16px; position: relative; }
ul.plain li::before { content: ""; position: absolute; left: 1px; top: 0.62em; width: 6px; height: 6px; border-radius: 1px; background: var(--accent); }
ul.plain.test li::before { border-radius: 50%; background: var(--ok); }

/* ---------- how it works strip ---------- */
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-bottom: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.how li { list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 13px 16px; border-left: 1px solid var(--line); }
.how li:first-child { border-left: 0; }
.how b { grid-row: span 2; font: 700 22px/1 var(--font-display); font-stretch: 125%; color: var(--accent-text); }
.how span { color: var(--ink-2); font-size: 13px; }
@media (max-width: 760px) { .how { grid-template-columns: minmax(0, 1fr); } .how li { border-left: 0; border-top: 1px solid var(--line); } .how li:first-child { border-top: 0; } }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 14px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); }
.banner .btn { margin-left: auto; flex: none; white-space: nowrap; }

/* ---------- all cards board ---------- */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
input[type="search"], input[type="text"], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 4px; padding: 7px 10px; min-height: 38px; max-width: 100%; }
textarea { width: 100%; resize: vertical; }
.tools input[type="search"] { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }
.seg button { appearance: none; background: var(--surface); border: 0; border-left: 1px solid var(--line-2); padding: 8px 13px; font-weight: 600; font-size: 13px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 1180px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.col > header { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 4px; }
.col h3 { font: 600 12px/1 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; }
.col h3 i { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 2px; }
.col .count { font: 500 12px var(--font-mono); color: var(--ink-3); }
.lane { display: grid; gap: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.lane > header { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
.lane h3 { font-size: 16px; font-stretch: 110%; }
.lane p { color: var(--ink-2); font-size: 13px; max-width: 70ch; }
.lane .prog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.lane .prog .meter { width: 120px; margin: 0; }
.lane .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.task { display: grid; gap: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); text-align: left; cursor: pointer; min-width: 0; }
.task:hover { border-color: var(--ink-3); box-shadow: var(--shadow); }
.task.is-done { background: var(--surface-2); }
.task.is-done h4 { color: var(--ink-2); }
.task .top1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.task h4 { font: 600 14.5px/1.3 var(--font-body); }
.epchips { display: grid; gap: 4px; }
.epchip { display: flex; align-items: center; gap: 6px; min-width: 0; }
.epchip code { font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.more { font-size: 12px; color: var(--ink-3); }
.task .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 9px; font-size: 12.5px; }
.who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-weight: 600; }
.who.none { color: var(--ink-3); font-weight: 500; }
.late { color: var(--bad); font-weight: 600; }
.due { color: var(--ink-3); }
.meta2 { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-3); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(840px, 100%); display: flex; flex-direction: column; background: var(--surface); box-shadow: var(--shadow); transform: translateX(102%); transition: transform 0.25s; visibility: hidden; }
.drawer.on { transform: none; visibility: visible; }
@media (prefers-reduced-motion: reduce) { .scrim, .drawer { transition: none; } }
.d-head { padding: calc(16px + env(safe-area-inset-top, 0px)) 24px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; background: var(--surface); }
.d-title { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.d-title h2 { font-size: 22px; font-stretch: 110%; }
.x { appearance: none; flex: none; width: 38px; height: 38px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); font-size: 20px; line-height: 1; cursor: pointer; }
.x:hover { border-color: var(--ink-3); }
.d-ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.d-body { overflow-y: auto; padding: 22px 24px calc(60px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 28px; align-content: start; }
.d-body h3 { font-size: 15px; font-stretch: 110%; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.d-body h3 small { font: 500 12px var(--font-body); color: var(--ink-3); }
.steps { list-style: none; display: grid; gap: 8px; }
.steps label { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; cursor: pointer; }
.steps input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--accent); }
.steps input:checked + span { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
.note { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); display: grid; gap: 4px; }
.note header { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.note p { white-space: pre-wrap; overflow-wrap: anywhere; }
.files code { display: block; padding: 3px 0; font-size: 12.5px; overflow-wrap: anywhere; }

/* ---------- endpoint spec ---------- */
.ep { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.ep > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 14px; cursor: pointer; }
.ep > summary::-webkit-details-marker { display: none; }
.ep > summary::after { content: "+"; margin-left: auto; font: 500 18px/1 var(--font-mono); color: var(--ink-3); }
.ep[open] > summary::after { content: "\2013"; }
.ep .route { font: 500 13px/1.4 var(--font-mono); overflow-wrap: anywhere; }
.ep .nm { font-weight: 600; }
.ep-body { display: grid; gap: 18px; padding: 16px; border-top: 1px solid var(--line); }
.ep-body h4 { font: 600 11px/1.3 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.ep-sum { font-size: 15px; max-width: 72ch; }
.io { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .io { grid-template-columns: minmax(0, 1fr); } }

.pg-body { display: grid; gap: 18px; padding: 16px; border-top: 1px solid var(--line); }
.pg-body h4 { font: 600 11px/1.3 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }

/* ---------- trello ---------- */

/* ---------- guide ---------- */
.dec { display: grid; gap: 10px; }

.dec p { color: var(--ink-2); font-size: 13.5px; }
.opts { display: grid; gap: 8px; }
.opt { appearance: none; display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); cursor: pointer; }
.opt .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-2); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

.cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.cmd code { overflow-wrap: anywhere; font-size: 12.5px; }

/* ---------- packages ---------- */
.pk { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 3px; background: var(--ink); color: var(--bg); font: 700 11px/1 var(--font-display); }
.letter { display: inline-grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 5px; background: var(--ink); color: var(--bg); font: 700 22px/1 var(--font-display); font-stretch: 125%; }
.letter.sm { width: 26px; height: 26px; font-size: 13px; border-radius: 4px; }

.bal-avg { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed var(--ink-3); pointer-events: none; }

.pkgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 410px), 1fr)); gap: 18px; align-items: start; margin-top: 4px; }

.no { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font: 600 11px/1 var(--font-mono); color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--line-2); }

  function showWho() {

    var v = $("#view"); v.innerHTML = "";
    renderAll();
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    if (!focus) window.scrollTo(0, 0);
  }

  /* ---------------------------------------------------------------- events */
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var a = el.dataset.act, id = el.dataset.id;
    if (el.tagName === "INPUT" || el.tagName === "SELECT") return;
    if (a === "tab") return setTab(id);
    if (a === "open-task") { if (ev.target.closest("button[data-act='take']")) return; return openTask(id, el.dataset.from); }
    if (a === "open-pkg") return openPackage(id);
    if (a === "take-pkg") { ev.stopPropagation(); return act.takePkg(id); }
    if (a === "release-pkg") { ev.stopPropagation(); return act.releasePkg(id); }
    if (a === "pkg-filter") { S.pf = el.dataset.v || ""; return renderPackages(); }
    if (a === "back-pkg") { var bk = S.openPkg; S.openTask = null; S.openPkg = bk; return renderDrawer(); }
    if (a === "rename-reset") return act.renamePkg(id, "");
    if (a === "close-drawer") return closeDrawer();
    if (a === "take") { ev.stopPropagation(); return act.take(id); }
    if (a === "release") return act.release(id);
    if (a === "status") return act.status(id, el.dataset.v);
    if (a === "nav") { if (S.openTask) { S.openTask = null; renderDrawer(); } if (el.dataset.tab === "endpoints") { S.epArea = ""; S.epQ = ""; } return setTab(el.dataset.tab, el.dataset.tab === "endpoints" ? id : null); }
    if (a === "view") { S.view = el.dataset.v; var bl = $("#boardList"); if (bl) { buildBoardTools(); renderBoardList(); } return; }
    if (a === "clear-filters") { S.f = { q: "", pkg: "", sprint: "", who: "", tier: "" }; buildBoardTools(); renderBoardList(); renderSummary(); return; }
    if (a === "who-filter") { S.f.who = S.f.who === el.dataset.name ? "" : el.dataset.name; if (S.tab !== "board") return setTab("board"); buildBoardTools(); renderBoardList(); renderSummary(); return; }
    if (a === "who") return showWho();
    if (a === "who-close") { $("#who").hidden = true; S.pending = null; return; }
    if (a === "pick-me") return pickMe(el.dataset.name);
    if (a === "copy-http") return copyText(toHttp(EPS[id]), "Request");
    if (a === "copy-text") return copyText(el.dataset.text, "Command");
    if (a === "copy-close") { $("#copybox").hidden = true; return; }
    if (a === "copy-card") { var c = D.newCards[el.dataset.key]; return copyText(c.title + "\nList: " + c.list + "\nStart: " + c.start + "\nDue: " + c.due + "\nLabels: " + c.labels.join(", ") + "\n\n" + c.desc, "Card text"); }
    if (a === "decide") return act.decide(id, el.dataset.v);
    if (a === "ep-area") { S.epArea = el.dataset.v; return renderEndpoints(); }
    if (a === "theme") {
      var dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("wf-theme", document.documentElement.dataset.theme); } catch (e) {}
      return;
    }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.id === "fpkg") { S.f.pkg = el.value; renderBoardList(); }
    else if (el.dataset && el.dataset.act === "move") { if (act.move(el.dataset.id, el.value) === false) { S.sig = null; renderDrawer(); } }
    else if (el.id === "taskPkg") { if (act.move(el.dataset.id, el.value) === false) { S.sig = null; renderDrawer(); } }
    else if (el.id === "pkgOwner") { if (act.setOwner(el.dataset.id, el.value || null) === false) { S.sig = null; renderDrawer(); } }
    else if (el.id === "fsp") { S.f.sprint = el.value; renderBoardList(); }
    else if (el.id === "fwho") { S.f.who = el.value; renderBoardList(); renderSummary(); }
    else if (el.id === "ftier") { S.f.tier = el.value; renderBoardList(); }
    else if (el.id === "assignee") { act.assign(el.dataset.id, el.value); }
    else if (el.dataset && el.dataset.act === "check") { el.checked = !el.checked; act.check(el.dataset.id, el.dataset.i); }
    else if (el.dataset && el.dataset.act === "trello-flag") { var on = el.checked; el.checked = !on; act.trello(el.dataset.key, on); }
  });
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.id === "fq") { S.f.q = el.value; renderBoardList(); }
    else if (el.id === "epq") { S.epQ = el.value; var l = $("#epList"); if (l) { var q = el.value.toLowerCase(); var list = D.endpoints.filter(function (e) { return (!S.epArea || e.area === S.epArea) && (!q || (e.route + " " + e.name + " " + e.summary).toLowerCase().indexOf(q) >= 0); }); l.innerHTML = list.map(function (e) { return epHTML(e, "tab", false); }).join("") || '<div class="empty"><h3>No endpoint matches</h3></div>'; } }
    else if (el.id === "noteText") { S.draft = el.value; }
    else if (el.id === "pkgName") { S.nameDraft = { id: el.closest("form").dataset.id, v: el.value }; }
  });
  document.addEventListener("submit", function (ev) {
    if (ev.target.id === "noteForm") { ev.preventDefault(); act.note(ev.target.dataset.id, $("#noteText").value); $("#noteText").value = ""; }
    else if (ev.target.id === "renameForm") { ev.preventDefault(); act.renamePkg(ev.target.dataset.id, $("#pkgName").value); }
  });
  document.addEventListener("toggle", function (ev) {
    var d = ev.target;
    if (!d.dataset || !d.dataset.key) return;
    if (d.open) { S.open.add(d.dataset.key); S.open.delete("closed:" + d.dataset.key); } else { S.open.delete(d.dataset.key); S.open.add("closed:" + d.dataset.key); }
  }, true);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if (!$("#copybox").hidden) { $("#copybox").hidden = true; return; }
      if (!$("#who").hidden) { $("#who").hidden = true; S.pending = null; return; }
      if (S.openTask) closeDrawer();
      return;
    }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("article.task")) { ev.preventDefault(); openTask(ev.target.dataset.id); return; }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("article.pkg")) { ev.preventDefault(); openPackage(ev.target.dataset.id); return; }
    if (ev.key === "Tab" && S.openTask) {
      var f = $$("#drawer button, #drawer select, #drawer textarea, #drawer input, #drawer a[href], #drawer summary").filter(function (x) { return !x.disabled && x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (!$("#drawer").contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
      else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });


  /* ---------------------------------------------------------------- drag a card onto another package */
  var dragId = null;
  var clearDrag = function () { $$(".is-drag, .is-over").forEach(function (x) { x.classList.remove("is-drag", "is-over"); }); };
  document.addEventListener("dragstart", function (ev) {
    var li = ev.target.closest ? ev.target.closest("[data-drag]") : null;
    if (!li) return;
    dragId = li.dataset.drag;
    try { ev.dataTransfer.setData("text/plain", dragId); ev.dataTransfer.effectAllowed = "move"; } catch (e) {}
    li.classList.add("is-drag");
  });
  document.addEventListener("dragend", function () { dragId = null; clearDrag(); });
  document.addEventListener("dragover", function (ev) {
    var box = ev.target.closest ? ev.target.closest("[data-pkg]") : null;
    if (!box || !dragId) return;
    ev.preventDefault();
    try { ev.dataTransfer.dropEffect = "move"; } catch (e) {}
    $$(".is-over").forEach(function (x) { if (x !== box) x.classList.remove("is-over"); });
    box.classList.add("is-over");
  });
  document.addEventListener("drop", function (ev) {
    var box = ev.target.closest ? ev.target.closest("[data-pkg]") : null;
    if (!box || !dragId) return;
    ev.preventDefault();
    var id = dragId; dragId = null; clearDrag();
    if (eff(TASKS[id]).pkg !== box.dataset.pkg) act.move(id, box.dataset.pkg);
  });

  /* ---------------------------------------------------------------- start */
  try { var th = localStorage.getItem("wf-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  var h = (location.hash || "").replace("#", "");
  if (TABS.some(function (t) { return t.id === h; })) S.tab = h;
  try { var nm = localStorage.getItem("wf-me"); if (nm && D.team.indexOf(nm) >= 0) S.me.name = nm; } catch (e) {}
  S.live = window.claude && window.claude.use ? "loading" : "off";
  renderAll();
  initLive().catch(function () { S.live = "off"; renderAll(); });
})();
</script>
