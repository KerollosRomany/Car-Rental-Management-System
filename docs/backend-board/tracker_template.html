<title>Wayfare Backend Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Design plan. Palette: Cloud Cobalt. A light page with white panels, one cobalt for every action, deep navy for the brand bar and code, and plain semantic colours for status.
   Type: Archivo (wide, for titles and numbers), Geist (text), Geist Mono (codes, hours, routes).
   Layout: a navy brand bar with the Wayfare plate, a summary card, tabs, then one working surface per tab. Packages are the home view. Cards open in a side drawer that holds the full spec. */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-2: #eef2fa;
  --ink: #0c1430;
  --ink-2: #3b4666;
  --ink-3: #5a6586;
  --line: #dde3f0;
  --line-2: #c4cde2;
  --accent: #2447f0;
  --accent-hover: #3a5cf8;
  --accent-ink: #ffffff;
  --accent-text: #1c3bd0;
  --accent-soft: rgba(36, 71, 240, 0.09);
  --accent-line: rgba(36, 71, 240, 0.45);
  --ok: #12603a; --ok-bg: #e2f3ea;
  --warn: #7a5200; --warn-bg: #fbf0d6;
  --bad: #a12c1e; --bad-bg: #fbe4e0;
  --info: #1d4c99; --info-bg: #e3ebfa;
  --brand-bg: #0a1230;
  --brand-ink: #f2f5ff;
  --brand-ink-2: #aab6dd;
  --brand-line: #2a3566;
  --stitch: #6b86ff;
  --code-bg: #0a1230;
  --code-ink: #e6ebff;
  --scrim: rgba(6, 12, 34, 0.55);
  --shadow: 0 1px 2px rgba(12, 20, 48, 0.06), 0 12px 30px rgba(12, 20, 48, 0.10);
  --font-display: "Archivo", "Geist", system-ui, sans-serif;
  --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070c1f; --surface: #0d1533; --surface-2: #131c40; --ink: #eef2ff; --ink-2: #b9c2e0; --ink-3: #8f9ac0;
    --line: #1d2850; --line-2: #2c3b70; --accent: #4f6dff; --accent-hover: #6b86ff; --accent-ink: #ffffff; --accent-text: #9fb2ff;
    --accent-soft: rgba(95, 124, 255, 0.16); --accent-line: rgba(130, 156, 255, 0.5);
    --ok: #86d9ab; --ok-bg: rgba(86, 190, 137, 0.14); --warn: #ebc274; --warn-bg: rgba(222, 170, 70, 0.16);
    --bad: #f5a193; --bad-bg: rgba(228, 96, 76, 0.16); --info: #a3c1f5; --info-bg: rgba(100, 148, 224, 0.16);
    --brand-bg: #050a1a; --brand-line: #1d2850; --code-bg: #060b1e; --scrim: rgba(0, 0, 0, 0.68);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 14px 34px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070c1f; --surface: #0d1533; --surface-2: #131c40; --ink: #eef2ff; --ink-2: #b9c2e0; --ink-3: #8f9ac0;
  --line: #1d2850; --line-2: #2c3b70; --accent: #4f6dff; --accent-hover: #6b86ff; --accent-ink: #ffffff; --accent-text: #9fb2ff;
  --accent-soft: rgba(95, 124, 255, 0.16); --accent-line: rgba(130, 156, 255, 0.5);
  --ok: #86d9ab; --ok-bg: rgba(86, 190, 137, 0.14); --warn: #ebc274; --warn-bg: rgba(222, 170, 70, 0.16);
  --bad: #f5a193; --bad-bg: rgba(228, 96, 76, 0.16); --info: #a3c1f5; --info-bg: rgba(100, 148, 224, 0.16);
  --brand-bg: #050a1a; --brand-line: #1d2850; --code-bg: #060b1e; --scrim: rgba(0, 0, 0, 0.68);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 14px 34px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--accent-text); }
code, pre, .mono { font-family: var(--font-mono); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 1360px; margin-inline: auto; padding-inline: max(16px, 3vw); }
[hidden] { display: none !important; }

/* ---------- brand bar ---------- */
.top { position: relative; background: var(--brand-bg); color: var(--brand-ink); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--stitch) 0 9px, transparent 9px 15px); opacity: 0.9; }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 68px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand svg { flex: none; height: 34px; width: auto; display: block; }
.brand h1 { font: 500 15px/1.2 var(--font-body); color: var(--brand-ink-2); padding-left: 16px; border-left: 1px solid var(--brand-line); }
.grow { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--brand-ink-2); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #5d6a99; }
.live.on i { background: #4fd49a; box-shadow: 0 0 0 3px rgba(79, 212, 154, 0.2); }
.live.ro i { background: #e0b24a; }
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 7px 14px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.mini { min-height: 30px; padding: 3px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.top .btn { background: transparent; border-color: var(--brand-line); color: var(--brand-ink); }
.top .btn:hover { border-color: #5d6a99; }
.me { display: inline-flex; align-items: center; gap: 9px; }

/* ---------- avatars ---------- */
.av { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font: 600 10.5px/1 var(--font-body); letter-spacing: 0.02em; color: #fff; flex: none; }
.av.lg { width: 34px; height: 34px; font-size: 12px; }
.av0 { background: #2447f0; } .av1 { background: #0a7f92; } .av2 { background: #6b3fd4; } .av3 { background: #b02a78; }
.av4 { background: #1f7a4d; } .av5 { background: #4a5570; } .av6 { background: #8a6d00; }

/* ---------- summary ---------- */
.sum { margin-top: 24px; padding: 24px 26px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr); gap: 20px 44px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.sum .lede { color: var(--ink-2); max-width: 54ch; margin-top: 8px; }
.sum h2 { font-size: 28px; font-weight: 700; font-stretch: 114%; letter-spacing: -0.01em; margin-top: 4px; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big strong { font: 700 46px/1 var(--font-display); font-stretch: 125%; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.big span { color: var(--ink-2); }
.meter { display: flex; height: 10px; margin-top: 12px; border-radius: 3px; overflow: hidden; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.meter i { display: block; height: 100%; }
.meter .m-done { background: var(--ok); } .meter .m-review { background: var(--info); } .meter .m-doing { background: var(--accent); }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.counts b { font-variant-numeric: tabular-nums; color: var(--ink); }
.counts .late b { color: var(--bad); }
.people { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.person { display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px 4px 4px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); font-size: 13px; cursor: pointer; }
.person:hover { border-color: var(--line-2); }
.person[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.person small { color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line-2); margin-top: 22px; scrollbar-width: thin; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 12px 16px 11px; font-weight: 600; color: var(--ink-3); white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { margin-left: 7px; padding: 1px 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font: 500 11px var(--font-mono); color: var(--ink-3); }
main { padding-block: 24px 64px; min-height: 60vh; }

/* ---------- shared bits ---------- */
.m { display: inline-block; padding: 3px 7px 2px; border-radius: 3px; font: 600 11px/1.3 var(--font-mono); letter-spacing: 0.04em; }
.m-get { background: var(--ok-bg); color: var(--ok); } .m-post { background: var(--accent-soft); color: var(--accent-text); }
.m-put { background: var(--info-bg); color: var(--info); } .m-delete { background: var(--bad-bg); color: var(--bad); }
.st { display: inline-block; padding: 3px 8px 2px; border-radius: 3px; font: 600 11px/1.3 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.st-todo { background: var(--surface-2); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.st-doing { background: var(--accent-soft); color: var(--accent-text); } .st-review { background: var(--info-bg); color: var(--info); } .st-done { background: var(--ok-bg); color: var(--ok); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.chip.warn { background: var(--warn-bg); color: var(--warn); box-shadow: none; } .chip.bad { background: var(--bad-bg); color: var(--bad); box-shadow: none; }
.chip.ok { background: var(--ok-bg); color: var(--ok); box-shadow: none; } .chip.acc { background: var(--accent-soft); color: var(--accent-text); box-shadow: none; }
button.chip { cursor: pointer; border: 0; font-family: inherit; }
button.chip:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.code { display: inline-block; padding: 2px 6px; border-radius: 3px; background: var(--ink); color: var(--bg); font: 600 11px/1.4 var(--font-mono); }
.size { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line-2); font: 600 11px/1 var(--font-mono); color: var(--ink-2); }
.muted { color: var(--ink-3); }
.eyebrow { font: 600 11px/1.3 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-text); }
.empty { padding: 36px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--ink-2); }
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; padding: 6px 10px 6px 0; font: 600 11px/1.3 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.t td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.t td:first-child { font-weight: 600; }
.t code { font-size: 12px; overflow-wrap: anywhere; }
.sect { display: grid; gap: 12px; }
.sect > h3 { font-size: 18px; font-stretch: 110%; }
.sect > p.lead { color: var(--ink-2); max-width: 70ch; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid > .panel { align-self: start; }
@media (max-width: 860px) { .g2, .g3, .sum { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
pre.json { margin: 0; padding: 12px 14px; max-height: 360px; overflow: auto; border-radius: 4px; background: var(--code-bg); color: var(--code-ink); font: 12.5px/1.55 var(--font-mono); }
ol.rules { padding-left: 22px; display: grid; gap: 6px; }
ul.plain { list-style: none; display: grid; gap: 5px; }
ul.plain li { padding-left: 16px; position: relative; }
ul.plain li::before { content: ""; position: absolute; left: 1px; top: 0.62em; width: 6px; height: 6px; border-radius: 1px; background: var(--accent); }
ul.plain.test li::before { border-radius: 50%; background: var(--ok); }

/* ---------- how it works strip ---------- */
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-bottom: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.how li { list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 13px 16px; border-left: 1px solid var(--line); }
.how li:first-child { border-left: 0; }
.how b { grid-row: span 2; font: 700 22px/1 var(--font-display); font-stretch: 125%; color: var(--accent-text); }
.how span { color: var(--ink-2); font-size: 13px; }
@media (max-width: 760px) { .how { grid-template-columns: minmax(0, 1fr); } .how li { border-left: 0; border-top: 1px solid var(--line); } .how li:first-child { border-top: 0; } }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 14px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); }
.banner .btn { margin-left: auto; flex: none; white-space: nowrap; }
.banner.info { background: var(--accent-soft); color: var(--ink); }

/* ---------- all cards board ---------- */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
input[type="search"], input[type="text"], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 4px; padding: 7px 10px; min-height: 38px; max-width: 100%; }
textarea { width: 100%; resize: vertical; }
.tools input[type="search"] { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }
.seg button { appearance: none; background: var(--surface); border: 0; border-left: 1px solid var(--line-2); padding: 8px 13px; font-weight: 600; font-size: 13px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 1180px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.col > header { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 4px; }
.col h3 { font: 600 12px/1 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; }
.col h3 i { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 2px; }
.col .count { font: 500 12px var(--font-mono); color: var(--ink-3); }
.lane { display: grid; gap: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.lane > header { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
.lane h3 { font-size: 16px; font-stretch: 110%; }
.lane p { color: var(--ink-2); font-size: 13px; max-width: 70ch; }
.lane .prog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.lane .prog .meter { width: 120px; margin: 0; }
.lane .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.task { display: grid; gap: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); text-align: left; cursor: pointer; min-width: 0; }
.task:hover { border-color: var(--ink-3); box-shadow: var(--shadow); }
.task.is-done { background: var(--surface-2); }
.task.is-done h4 { color: var(--ink-2); }
.task .top1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.task h4 { font: 600 14.5px/1.3 var(--font-body); }
.epchips { display: grid; gap: 4px; }
.epchip { display: flex; align-items: center; gap: 6px; min-width: 0; }
.epchip code { font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.more { font-size: 12px; color: var(--ink-3); }
.task .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 9px; font-size: 12.5px; }
.who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-weight: 600; }
.who.none { color: var(--ink-3); font-weight: 500; }
.late { color: var(--bad); font-weight: 600; }
.due { color: var(--ink-3); }
.meta2 { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-3); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(840px, 100%); display: flex; flex-direction: column; background: var(--surface); box-shadow: var(--shadow); transform: translateX(102%); transition: transform 0.25s; visibility: hidden; }
.drawer.on { transform: none; visibility: visible; }
@media (prefers-reduced-motion: reduce) { .scrim, .drawer { transition: none; } }
.d-head { padding: calc(16px + env(safe-area-inset-top, 0px)) 24px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; background: var(--surface); }
.d-title { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.d-title h2 { font-size: 22px; font-stretch: 110%; }
.x { appearance: none; flex: none; width: 38px; height: 38px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); font-size: 20px; line-height: 1; cursor: pointer; }
.x:hover { border-color: var(--ink-3); }
.d-ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.d-body { overflow-y: auto; padding: 22px 24px calc(60px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 28px; align-content: start; }
.d-body h3 { font-size: 15px; font-stretch: 110%; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.d-body h3 small { font: 500 12px var(--font-body); color: var(--ink-3); }
.steps { list-style: none; display: grid; gap: 8px; }
.steps label { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; cursor: pointer; }
.steps input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--accent); }
.steps input:checked + span { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
.note { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); display: grid; gap: 4px; }
.note header { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.note p { white-space: pre-wrap; overflow-wrap: anywhere; }
.files code { display: block; padding: 3px 0; font-size: 12.5px; overflow-wrap: anywhere; }

/* ---------- endpoint spec ---------- */
.ep { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.ep > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 14px; cursor: pointer; }
.ep > summary::-webkit-details-marker { display: none; }
.ep > summary::after { content: "+"; margin-left: auto; font: 500 18px/1 var(--font-mono); color: var(--ink-3); }
.ep[open] > summary::after { content: "\2013"; }
.ep .route { font: 500 13px/1.4 var(--font-mono); overflow-wrap: anywhere; }
.ep .nm { font-weight: 600; }
.ep-body { display: grid; gap: 18px; padding: 16px; border-top: 1px solid var(--line); }
.ep-body h4 { font: 600 11px/1.3 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.ep-sum { font-size: 15px; max-width: 72ch; }
.io { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .io { grid-template-columns: minmax(0, 1fr); } }
.kind { display: inline-block; margin-bottom: 8px; }
.sub { margin-top: 10px; }
details.dto { margin-top: 10px; }
details.dto > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.list-ep { display: grid; gap: 8px; }

/* ---------- pages tab ---------- */
.pg { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.pg > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 14px; cursor: pointer; }

.pg > summary .file { font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.pg > summary .tt { display: grid; }
.pg > summary .tt span { font-size: 12.5px; color: var(--ink-3); }
.pg > summary::after { content: "+"; font: 500 18px/1 var(--font-mono); color: var(--ink-3); }
.pg[open] > summary::after { content: "\2013"; }
.pg-body { display: grid; gap: 18px; padding: 16px; border-top: 1px solid var(--line); }
.pg-body h4 { font: 600 11px/1.3 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
@media (max-width: 700px) { .pg > summary { grid-template-columns: minmax(0, 1fr) auto; } .pg > summary .file { grid-column: 1 / -1; } }
.grp { display: grid; gap: 10px; margin-bottom: 22px; }
.grp > h3 { font-size: 17px; font-stretch: 110%; display: flex; gap: 10px; align-items: baseline; }
.grp > h3 small { font: 500 12.5px var(--font-body); color: var(--ink-3); }

/* ---------- data tab ---------- */
.ent h4 { font-size: 16px; font-stretch: 110%; }
.ent .tbl-name { font: 500 12px var(--font-mono); color: var(--ink-3); }
.ent p { color: var(--ink-2); font-size: 13px; margin: 4px 0 10px; }

.enum { display: grid; gap: 6px; }
.enum ul { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
.enum li { padding: 2px 8px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font: 500 12px var(--font-mono); }
.enum li.fix { background: var(--warn-bg); color: var(--warn); box-shadow: none; }

/* ---------- trello ---------- */
.nc { display: grid; gap: 8px; }
.nc header { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nc h4 { font: 600 15px/1.3 var(--font-body); }
.nc p { color: var(--ink-2); font-size: 13.5px; }
.nc .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.tick { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
.tick input { width: 17px; height: 17px; accent-color: var(--accent); }

/* ---------- guide ---------- */
.dec { display: grid; gap: 10px; }
.dec h4 { font: 600 15px/1.3 var(--font-body); }
.dec p { color: var(--ink-2); font-size: 13.5px; }
.opts { display: grid; gap: 8px; }
.opt { appearance: none; display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); cursor: pointer; }
.opt .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-2); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .dot { box-shadow: inset 0 0 0 5px var(--accent); }
.cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.cmd code { overflow-wrap: anywhere; font-size: 12.5px; }

/* ---------- packages ---------- */
.pk { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 3px; background: var(--ink); color: var(--bg); font: 700 11px/1 var(--font-display); }
.letter { display: inline-grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 5px; background: var(--ink); color: var(--bg); font: 700 22px/1 var(--font-display); font-stretch: 125%; }
.letter.sm { width: 26px; height: 26px; font-size: 13px; border-radius: 4px; }
.pk-intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px 40px; align-items: end; margin-bottom: 20px; }
.pk-intro h3 { font-size: 24px; font-weight: 700; font-stretch: 112%; margin-bottom: 6px; }
.pk-intro .lead { color: var(--ink-2); max-width: 66ch; }
@media (max-width: 860px) { .pk-intro { grid-template-columns: minmax(0, 1fr); } }
.bal { display: grid; gap: 10px; padding: 16px 20px 14px; margin-bottom: 20px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.bal-t { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; font: 600 11px/1.3 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.bal-t span:last-child { letter-spacing: 0.02em; text-transform: none; font-weight: 500; }
.bal-plot { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(6px, 2vw, 22px); height: 168px; }
.bal-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; min-width: 0; }
.bal-bar { position: relative; width: min(100%, 72px); border-radius: 4px 4px 0 0; background: var(--line-2); transition: height 0.3s; }
.bal-bar.taken { background: var(--accent); }
.bal-bar.done { background: var(--ok); }
.bal-bar b { position: absolute; left: 50%; top: 7px; transform: translateX(-50%); font: 600 12px/1 var(--font-mono); color: var(--ink); white-space: nowrap; }
.bal-bar.taken b, .bal-bar.done b { color: #fff; }
.bal-who { max-width: 100%; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bal-avg { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed var(--ink-3); pointer-events: none; }
.bal-avg span { position: absolute; left: 0; top: -19px; padding: 0 5px 0 0; background: var(--surface); font: 500 11px/1.4 var(--font-mono); color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) { .bal-bar { transition: none; } }
.pkgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 410px), 1fr)); gap: 18px; align-items: start; margin-top: 4px; }
.pkg { display: grid; gap: 14px; align-content: start; padding: 20px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; min-width: 0; }
.pkg:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.pkg.is-taken .letter { background: var(--accent); color: var(--accent-ink); }
.pkg.is-done { background: var(--surface-2); }
.pkg.is-done .letter { background: var(--ok); color: var(--bg); }
.pkg.is-over { outline: 2px dashed var(--accent); outline-offset: 3px; background: var(--accent-soft); }
.pk-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.pk-title h3 { font-size: 18px; font-stretch: 110%; }
.pk-sub { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--ink-3); }
.pk-sub b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.pk-owner { display: flex; align-items: center; justify-self: end; }
.pkg .goal { color: var(--ink-2); font-size: 13.5px; max-width: 62ch; }
.pkg .pages { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); }
.pkg .pages code, .chips code { padding: 1px 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 11.5px; color: var(--ink-2); }
.mini-list { list-style: none; display: grid; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.mini { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.mini:first-child { border-top: 0; }
.mini:hover { background: var(--surface-2); }
.mini[draggable="true"] { cursor: grab; }
.mini.is-drag { opacity: 0.4; }
.mini.is-done { color: var(--ink-3); }
.mini.is-done .mt { text-decoration: line-through; text-decoration-color: var(--line-2); }
.mini .mt { min-width: 0; overflow-wrap: anywhere; }
.mini .code { margin-right: 6px; }
.mini .md { font: 500 11px/1 var(--font-mono); color: var(--ink-3); white-space: nowrap; }
.no { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font: 600 11px/1 var(--font-mono); color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--line-2); }
.no.s-doing { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.no.s-review { background: var(--info); color: var(--bg); box-shadow: none; }
.no.s-done { background: var(--ok); color: var(--bg); box-shadow: none; }
.pk-foot { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.pk-ready { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pk-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pk-hint { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3); }
details.fin { margin-top: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
details.fin > summary { cursor: pointer; padding: 13px 18px; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.fin > summary::-webkit-details-marker { display: none; }
details.fin > summary::before { content: "+"; font: 500 18px/1 var(--font-mono); color: var(--ink-3); }
details.fin[open] > summary::before { content: "\2013"; }
details.fin .n { font: 500 12px var(--font-mono); color: var(--ink-3); }
details.fin .cards2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; padding: 4px 18px 18px; }
.lbl { font: 600 11px/1.3 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.rename { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rename input { flex: 1 1 220px; min-width: 0; }
.tlist { list-style: none; display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; padding: 11px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
.trow .no { margin-top: 1px; }
.tr-main { display: grid; gap: 6px; min-width: 0; }
.tr-title { appearance: none; background: none; border: 0; padding: 0; text-align: left; font: 600 14.5px/1.35 var(--font-body); color: var(--ink); cursor: pointer; }
.tr-title:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.tr-title .code { margin-right: 6px; }
.mv { display: grid; gap: 3px; font: 600 10.5px/1.2 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.mv select { min-height: 32px; padding: 3px 8px; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink); max-width: 200px; }
@media (max-width: 560px) { .trow { grid-template-columns: 24px minmax(0, 1fr); } .trow .mv { grid-column: 2; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tip { margin-top: 8px; padding: 10px 12px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); font-size: 13.5px; }
.back { margin-bottom: 8px; }
.d-ctl .lbl { margin-right: -4px; }

/* ---------- ownership ---------- */
.ic { flex: none; }
.padlock { display: inline-flex; margin-left: 6px; color: var(--ink-3); }
.lockline { display: flex; gap: 8px; align-items: center; margin: -2px 0 0; font-size: 12.5px; color: var(--ink-3); }
.lockbar { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 4px; background: var(--warn-bg); color: var(--ink); font-size: 13.5px; }
.lockbar .ic { margin-top: 3px; }
.lockbar .btn { margin-left: auto; flex: none; }
.lockbar.mine { background: var(--accent-soft); }
.lockbar.free { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.pkg.is-locked .mini { cursor: pointer; }
.d-ctl select[disabled], .mv select[disabled] { opacity: 0.6; cursor: not-allowed; }
.steps input[disabled] { cursor: not-allowed; }
.seg button[disabled] { opacity: 0.55; cursor: not-allowed; }
.rename input[disabled] { opacity: 0.6; }

/* ---------- schedule ---------- */
:root { --g-crit: #d03d2c; --g-crit-ink: #ffffff; --g-bar-ink: #ffffff; }
.chip.crit { background: var(--bad-bg); color: var(--bad); box-shadow: none; font-weight: 600; }
.pk-when { display: grid; gap: 8px; padding: 11px 13px; border-radius: 5px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.w-dates { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 14px; }
.w-dates > div { display: grid; gap: 2px; }
.w-dates span { font: 600 10.5px/1.2 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.w-dates b { font: 600 15px/1.25 var(--font-body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.w-dates i { font-style: normal; color: var(--ink-3); font-size: 16px; line-height: 1.2; padding-bottom: 1px; }
.w-dates .w-len { margin-left: auto; text-align: right; }
.pk-when p { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
.pk-when p b { color: var(--ink); font-weight: 600; }
.plan-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 13px 16px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.plan-strip p { flex: 1 1 340px; color: var(--ink-2); font-size: 14px; }
.plan-strip b { color: var(--ink); }
.stat { display: grid; gap: 3px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); min-width: 0; align-content: start; }
.stat span { font: 600 10.5px/1.2 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.stat b { font: 700 19px/1.2 var(--font-display); font-stretch: 112%; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat small { color: var(--ink-3); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.sch-dates { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
@media (max-width: 760px) { .stats, .sch-dates { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sch .why { margin-bottom: 12px; font-size: 14px; color: var(--ink-2); max-width: 72ch; }
.sch .why b { color: var(--ink); }
.pace-box { display: grid; gap: 14px; }
.pace-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pace { appearance: none; display: grid; gap: 3px; justify-items: start; text-align: left; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 5px; background: var(--surface); cursor: pointer; min-width: 0; }
.pace b { font: 700 16px/1.1 var(--font-display); font-stretch: 112%; }
.pace span { font-size: 12px; color: var(--ink-3); }
.pace:hover:not([disabled]) { border-color: var(--ink-3); }
.pace[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pace[aria-pressed="true"] span { color: var(--accent-text); }
.pace[disabled] { cursor: default; }
@media (max-width: 560px) { .pace-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* mini timeline in the package window */
.mg { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); }
.mg-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; }
.mg-l { display: flex; align-items: center; }
.mg-t { position: relative; height: 22px; }
.mg-t::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--accent); }
.mg-b { position: absolute; top: 3px; height: 16px; border-radius: 3px; background: var(--ink-3); opacity: 0.5; }
.mg-row.own .mg-b { background: var(--accent); opacity: 1; }
.mg-t em { position: absolute; top: 4px; font: 500 11.5px/14px var(--font-mono); font-style: normal; color: var(--ink-2); white-space: nowrap; }
.mg-row.own .mg-t em.in { color: var(--accent-ink); }
.mg-axis { display: flex; justify-content: space-between; margin-left: 40px; font: 500 11px var(--font-mono); color: var(--ink-3); }

/* gantt chart */
.gantt { display: grid; gap: 12px; }
.g-tools { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.g-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-3); align-items: center; }
.g-legend span { display: inline-flex; align-items: center; gap: 6px; }
.g-legend i { display: inline-block; width: 18px; height: 10px; border-radius: 2px; background: var(--accent); }
.g-legend i.crit { background: var(--g-crit); }
.g-legend i.test { background: var(--ink-2); }
.g-legend i.wait { background: repeating-linear-gradient(135deg, var(--accent-soft) 0 3px, transparent 3px 7px); box-shadow: inset 0 0 0 1px var(--accent-line); }
.g-legend i.today { width: 2px; height: 12px; border-radius: 0; }
.g-legend i.endl { width: 0; height: 12px; border-radius: 0; border-left: 2px dashed var(--ink); background: none; }
.g-legend i.dia { width: 9px; height: 9px; border-radius: 1px; transform: rotate(45deg); background: var(--ink); }
.g-scroll { --lw: 190px; overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); max-width: 100%; }
@media (max-width: 640px) { .g-scroll { --lw: 104px; } }
.g-inner { position: relative; width: calc(var(--lw) + var(--tw)); }
.g-row { display: flex; border-top: 1px solid var(--line); }
.g-head .g-row:first-child { border-top: 0; }
.g-label { position: sticky; left: 0; z-index: 4; flex: 0 0 var(--lw); width: var(--lw); display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--surface); border-right: 1px solid var(--line-2); min-width: 0; }
.g-head .g-label { font: 600 11px/1.3 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.g-track { position: relative; flex: 0 0 var(--tw); width: var(--tw); background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: var(--dw) 100%; }
.g-axis { height: 24px; background-image: none; }
.g-mo, .g-dy { position: absolute; top: 0; height: 100%; display: flex; align-items: center; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; }
.g-mo { padding-left: 6px; font-weight: 600; letter-spacing: 0.04em; border-left: 1px solid var(--line-2); color: var(--ink-2); }
.g-dy { justify-content: center; font: 500 10.5px var(--font-mono); border-left: 1px solid var(--line); }
.g-dy.now { background: var(--accent); color: var(--accent-ink); font-weight: 600; border-left-color: var(--accent); }
.g-name { appearance: none; display: flex; align-items: center; gap: 8px; min-width: 0; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
.g-name .gn { display: grid; min-width: 0; line-height: 1.25; }
.g-name .gn b { font: 600 13px/1.25 var(--font-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-name .gn small { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-name:hover .gn b { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.g-name .code, .g-name .letter { flex: none; }
.g-span { position: absolute; border-radius: 4px; background: repeating-linear-gradient(135deg, var(--accent-soft) 0 3px, transparent 3px 7px); box-shadow: inset 0 0 0 1px var(--accent-line); }
.g-span.brief { background: var(--ink-3); box-shadow: none; opacity: 0.5; border-radius: 2px; }
.g-seg { position: absolute; z-index: 3; display: flex; align-items: center; justify-content: center; min-width: 3px; padding: 0 3px; border: 0; border-radius: 3px; background: var(--accent); color: var(--g-bar-ink); font: 600 10.5px/1 var(--font-mono); cursor: pointer; overflow: hidden; white-space: nowrap; }
.g-seg:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.g-seg.test { background: var(--ink-2); color: var(--bg); }
.g-seg.crit { background: var(--g-crit); color: var(--g-crit-ink); }
.g-seg.doing { box-shadow: inset 0 -3px 0 rgba(255, 255, 255, 0.55); }
.g-note { position: absolute; font: 500 11.5px/1 var(--font-mono); color: var(--ink-2); white-space: nowrap; pointer-events: none; }
.g-base { position: absolute; height: 5px; border-radius: 3px; background: var(--ink-3); opacity: 0.5; }
.g-dia { position: absolute; width: 10px; height: 10px; margin-left: -5px; background: var(--ink); transform: rotate(45deg); border-radius: 1px; }
.g-dia.late { background: var(--g-crit); }
.g-body { position: relative; }
.g-links { position: absolute; left: var(--lw); top: 0; z-index: 2; pointer-events: none; overflow: visible; }
.g-l { fill: none; stroke: var(--ink-3); stroke-width: 1.3; }

  /* ---------------------------------------------------------------- toast and copy */
  function toast(msg, bad) {

    el.className = "toast" + (bad ? " bad" : "");

  }

      navigator.clipboard.writeText(text).then(function () { toast((label || "Text") + " copied."); }, fallback);
    } else fallback();
  }

  /* ---------------------------------------------------------------- live data */
  var queue = {};

  }
  function guard(fn) {
    if (!S.db) { toast("Live sharing is off in this view, so nothing is saved. Open the artifact link to work together.", true); return false; }
    if (!S.canWrite) { toast("View only. The board owner has to give you Contributor access, or add your email as an Editor, in Share.", true); return false; }
    if (!S.me.name) { S.pending = fn; showWho(); return false; }
    return true;
  }
  /* A refused write (invalid_argument) means this account may read the board but not change it. Say so once and switch to view only. */
  function readOnly() {

  }
  function failed(e) {

  }
  function report(errs, okMsg) {
    var bad = errs.filter(Boolean);

  }
  function save(path, data, okMsg) { return saveQuiet(path, data).then(function (e) { return report([e], okMsg); }); }
  function saveTask(id, patch, okMsg, quiet) {
    var cur = S.tasks[id] || {};

    return quiet ? saveQuiet("tasks/" + id, next) : save("tasks/" + id, next, okMsg);
  }
  var act = {
    take: function (id) { var pid = eff(TASKS[id]).pkg; if (PKG[pid] && PKG[pid].kind === "package") act.takePkg(pid); },
    release: function (id) { act.releasePkg(eff(TASKS[id]).pkg); },
    status: function (id, v) {
      if (!guard(function () { act.status(id, v); })) return;
      var m = cardLock(id); if (m) { toast(m, true); return; }

    assign: function () { toast("A card belongs to the owner of its package. Move the card to another package to give it away.", true); },

    },
    setOwner: function (pid, name, okMsg) {
      if (!guard(function () { act.setOwner(pid, name, okMsg); })) return false;
      var old = (S.packages[pid] || {}).owner || null;
      if (old && !isMine(pid) && !(S.isOwner && !name)) { toast(lockMsg(pid), true); return false; }
      if (name && name !== S.me.name && !S.isOwner) { toast("Take a free package for yourself. Only the board owner can give a package to someone else.", true); return false; }
      if (old === name) return true;
      var ownerId = name ? (name === S.me.name ? S.me.id : memberId(name)) : null;
      var jobs = [savePkg(pid, { owner: name || null, ownerId: ownerId || null }, null, true)];

    takePkg: function (pid) {

    },
    releasePkg: function (pid) { act.setOwner(pid, null); },
    unlockPkg: function (pid) { if (S.isOwner) act.setOwner(pid, null, "Package " + PKG[pid].letter + " is unlocked and free again."); },
    move: function (id, pid) {

  /* ---------------------------------------------------------------- board */
  function pass(t) {

      '<div class="sect" style="margin-bottom:28px"><h3>What changes, and what already matches</h3>' + changes + "</div>" +
      '<div class="sect" style="margin-bottom:28px"><h3>DTOs the endpoints return</h3><p class="lead">JSON names are camelCase. Money is a decimal with two places. Open one to see its fields and a sample.</p><div class="list-ep">' + dtos + "</div></div>" +
      '<div class="sect"><h3>Front end names and their API names</h3><p class="lead">The front end keeps its own names in assets/js/data.js. When api.js is wired to fetch, it translates with this table. Back end code only needs the right column.</p>' + table(["Front end", "API"], D.fieldMap.map(function (r) { return ["<code>" + esc(r[0]) + "</code>", "<code>" + esc(r[1]) + "</code>"]; })) + "</div>";
  }

  /* ---------------------------------------------------------------- trello tab */
  function renderTrello() {
    var keys = Object.keys(D.newCards);
    var added = keys.filter(function (k) { return S.trello[k] && S.trello[k].added; }).length;
    var cards = keys.map(function (k) {
      var c = D.newCards[k], flag = S.trello[k] || {};
      var task = D.tasks.filter(function (t) { return t.newCard === k; })[0];
      return '<article class="panel nc"><header><span class="chip acc">' + esc(c.list) + "</span>" + c.labels.map(function (l) { return '<span class="chip">' + esc(l) + "</span>"; }).join("") + "<span class=\"muted\" style=\"font-size:12.5px\">" + fd(c.start) + (c.start !== c.due ? " to " + fd(c.due) : "") + "</span></header><h4>" + esc(c.title) + "</h4><p>" + esc(c.desc) + '</p><div class="row"><label class="tick"><input type="checkbox" data-act="trello-flag" data-key="' + k + '"' + (flag.added ? " checked" : "") + "> Added on Trello</label>" + (flag.added && flag.by ? '<span class="muted" style="font-size:12.5px">by ' + esc(flag.by.split(" ")[0]) + "</span>" : "") +
        '<button class="btn mini" type="button" data-act="copy-card" data-key="' + k + '">Copy card text</button>' + (task ? '<button class="chip" type="button" data-act="open-task" data-id="' + task.id + '"><b>' + esc(task.code) + "</b> " + esc(task.title) + "</button>" : "") + "</div></article>";
    }).join("");
    var rows = D.trelloCards.map(function (c) {
      var ts = D.tasks.filter(function (t) { return t.trello.indexOf(c.n) >= 0; }).map(eff);
      var isNew = (D.addedCards || []).some(function (a) { return a.n === c.n; });
      return ['<a href="' + esc(c.url) + '" target="_blank" rel="noopener">#' + c.n + "</a>", esc(c.name) + (isNew ? ' <span class="chip acc">Added from this board</span>' : ""), esc(c.list), c.due ? fd(c.due) : "", c.done ? '<span class="chip ok">Done</span>' : '<span class="chip">Open</span>', ts.map(function (t) { return '<button class="chip" type="button" data-act="open-task" data-id="' + t.id + '"><b>' + esc(t.code) + "</b> " + STATUS[t.status] + "</button>"; }).join(" ") || '<span class="muted">none</span>'];
    });
    $("#view").innerHTML =
      (keys.length
        ? '<div class="sect" style="margin-bottom:20px"><h3>Trello stays the plan</h3><p class="lead">The board has no card for ' + keys.length + " pieces of work this spec needs. Add them, then tick them here. Dates follow the sprint rhythm already on the board. " + added + " of " + keys.length + ' added so far.</p><p><a class="btn" href="' + esc(D.boardUrl) + '" target="_blank" rel="noopener">Open the Trello board</a></p></div>' + '<div class="grid g2" style="margin-bottom:30px">' + cards + "</div>"
        : '<div class="sect" style="margin-bottom:24px"><h3>Trello matches this board</h3><p class="lead">The ' + (D.addedCards || []).length + " cards this spec needed are on Trello now. Each sits at the bottom of its sprint list with a due date and a label. The planned start date is in the card text, because the connector can only set a due date. Move a card up or down the list as you like.</p><p><a class=\"btn\" href=\"" + esc(D.boardUrl) + '" target="_blank" rel="noopener">Open the Trello board</a></p></div>') +
      '<div class="sect"><h3>Cards that are on the board now</h3><p class="lead">Read from Trello on ' + esc(new Date(D.generatedAt).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })) + ". Every open card belongs to a task here.</p>" + table(["Card", "Title", "Sprint", "Due", "On Trello", "Task here"], rows) + "</div>";
  }

  /* ---------------------------------------------------------------- guide tab */
  function renderGuide() {
    var dec = D.decisions.map(function (d) {
      var cur = S.decisions[d.id];
      return '<article class="panel dec"><h4>' + esc(d.title) + "</h4><p>" + esc(d.why) + '</p><div class="opts" role="group" aria-label="' + esc(d.title) + '">' + d.options.map(function (o) { return '<button class="opt" type="button" data-act="decide" data-id="' + d.id + '" data-v="' + o.key + '" aria-pressed="' + (cur && cur.choice === o.key) + '"><span class="dot"></span><span>' + esc(o.text) + "</span>" + (o.rec ? '<span class="chip acc">Suggested</span>' : "") + "</button>"; }).join("") + "</div>" + (cur ? '<span class="muted" style="font-size:12.5px">Chosen by ' + esc((cur.by || "").split(" ")[0]) + " on " + esc(new Date(cur.at).toLocaleDateString("en-US", { month: "short", day: "numeric" })) + "</span>" : '<span class="muted" style="font-size:12.5px">Not decided yet. The spec uses the suggested answer.</span>') + "</article>";
    }).join("");
    var setup = D.setup.map(function (s) { return [esc(s[0]), '<div class="cmd"><code>' + esc(s[1]) + '</code><button class="btn mini" type="button" data-act="copy-text" data-text="' + esc(s[1]) + '">Copy</button></div>']; });
    $("#view").innerHTML =
      '<div class="grid g2" style="margin-bottom:28px"><div class="panel sect"><h3>How the team uses this board</h3><ul class="plain"><li>Open Packages and take one that is free. You own all its cards, listed in the order to build them.</li><li>If the split feels uneven, drag a card onto another package, or open the package and change the Package of a card. The card goes to the owner of that package.</li><li>Build each card on its own branch, open a pull request, and ask a second member to review it. No code reaches main before that.</li><li>Move the card to In review when the pull request is open, and to Done after the merge. Then tick the Trello card.</li><li>Stuck for more than a day? Leave a note on the card and say it in the mid-week check-in.</li><li>A card that Waits for another needs it first. You can still read its spec and write the DTO and the mapper while you wait.</li></ul></div>' +
      '<div class="panel sect"><h3>Done means</h3><ul class="plain test">' + D.doneDef.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul><h3 style="margin-top:6px">Card sizes</h3><ul class="plain"><li><b>S</b> about 1 to 2 hours</li><li><b>M</b> about half a day</li><li><b>L</b> about a full day</li></ul></div></div>' +
      '<div class="sect" style="margin-bottom:28px"><h3>Getting started</h3>' + table(["Step", "Do this"], setup) + "</div>" +
      '<div class="sect" style="margin-bottom:28px"><h3>How the dates are worked out</h3><ul class="plain"><li>Every card has a size. S is 2 hours of work, M is 4 and L is 8. A card in review has 1 hour left. Finished cards do not count.</li><li>One person works through a package, one card at a time. A card never starts before the cards it needs are finished, even when they belong to another package. So a package starts when the first card it needs is ready, and it can wait again later.</li><li>The board owner picks how many hours a day each member works. Every date follows from that, so changing it moves the whole plan.</li><li>Every calendar day counts, starting today, like the Trello sprints. No time is added for meetings or reviews.</li><li>The plan starts again from today every time you open the board. When someone finishes a card or moves one to another package, the dates change for everyone.</li><li>The critical path is the chain of packages that decides the end date. Room is how many days a package can slip without moving the end date.</li><li>Trello keeps the deadlines. The schedule shows them beside the plan and says when the plan would miss one.</li></ul></div>' +
      '<div class="sect" style="margin-bottom:28px"><h3>Words used on this board</h3>' + table(["Word", "Meaning"], (D.glossary || []).map(function (g) { return [esc(g[0]), esc(g[1])]; })) + "</div>" +
      '<div class="sect" style="margin-bottom:28px"><h3>API conventions</h3><p class="lead">Decide these once so every endpoint looks the same to the front end.</p>' + table(["Topic", "Convention"], D.conventions.map(function (c) { return [esc(c[0]), esc(c[1])]; })) + "</div>" +
      '<div class="sect"><h3>Decisions for the team</h3><p class="lead">The spec already uses the suggested answer in each case. Pick another one here if the team disagrees, and the person who builds that card will see it.</p><div class="grid g2">' + dec + "</div></div>";
  }

  /* ---------------------------------------------------------------- render */
  function renderView() {
    $("#view").setAttribute("aria-labelledby", "tab-" + S.tab);
    ({ packages: renderPackages, schedule: renderSchedule, board: renderBoard, pages: renderPages, endpoints: renderEndpoints, data: renderData, trello: renderTrello, guide: renderGuide })[S.tab]();
    if (S.focusEp) {
      var el = $('#view [data-ep="' + S.focusEp + '"]') || $('#view [data-key="' + S.focusEp + '"]');
      S.focusEp = null;
      if (el) { if (el.tagName === "DETAILS") { el.open = true; S.open.add(el.dataset.key); } el.scrollIntoView({ block: "start" }); }
    }
  }
  function renderAll() {
    renderHeader(); renderSummary(); renderTabs();
    if (S.tab === "board") { renderBoard(); } else if (!S.skipView) { renderView(); }
    renderDrawer();
  }
  function setTab(id, focus) {
    S.tab = id; S.focusEp = focus || null;
    var v = $("#view"); v.innerHTML = "";
    renderAll();
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    if (!focus) window.scrollTo(0, 0);
  }

  /* ---------------------------------------------------------------- events */
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var a = el.dataset.act, id = el.dataset.id;
    if (el.tagName === "INPUT" || el.tagName === "SELECT") return;
    if (a === "hint-gone") { S.hintGone = true; try { localStorage.setItem("wf-share-hint", "1"); } catch (x) {} return renderAll(); }
    if (a === "copy-owner-msg") return copyText("Hi, I opened the Wayfare Backend Board but it says View only, so I cannot take a package. Please open Share on the board and either give me Contributor access, or turn off \"Anyone with the link\" and add my email as an Editor. Then I can take my package. Thanks!", "Message");
    if (a === "tab") return setTab(id);
    if (a === "pace") return act.setPace(el.dataset.v);
    if (a === "gv-mode") { S.gv.mode = el.dataset.v; return renderSchedule(); }
    if (a === "open-task") { if (ev.target.closest("button[data-act='take']")) return; return openTask(id, el.dataset.from); }
    if (a === "open-pkg") return openPackage(id);
    if (a === "take-pkg") { ev.stopPropagation(); return act.takePkg(id); }
    if (a === "release-pkg") { ev.stopPropagation(); return act.releasePkg(id); }
    if (a === "pkg-filter") { S.pf = el.dataset.v || ""; return renderPackages(); }
    if (a === "back-pkg") { var bk = S.openPkg; S.openTask = null; S.openPkg = bk; return renderDrawer(); }
    if (a === "rename-reset") return act.renamePkg(id, "");
    if (a === "close-drawer") return closeDrawer();
    if (a === "take") { ev.stopPropagation(); return act.take(id); }
    if (a === "unlock-pkg") { ev.stopPropagation(); return act.unlockPkg(id); }
    if (a === "release") return act.release(id);
    if (a === "status") return act.status(id, el.dataset.v);
    if (a === "nav") { if (S.openTask) { S.openTask = null; renderDrawer(); } if (el.dataset.tab === "endpoints") { S.epArea = ""; S.epQ = ""; } return setTab(el.dataset.tab, el.dataset.tab === "endpoints" ? id : null); }
    if (a === "view") { S.view = el.dataset.v; var bl = $("#boardList"); if (bl) { buildBoardTools(); renderBoardList(); } return; }
    if (a === "clear-filters") { S.f = { q: "", pkg: "", sprint: "", who: "", tier: "" }; buildBoardTools(); renderBoardList(); renderSummary(); return; }
    if (a === "who-filter") { S.f.who = S.f.who === el.dataset.name ? "" : el.dataset.name; if (S.tab !== "board") return setTab("board"); buildBoardTools(); renderBoardList(); renderSummary(); return; }
    if (a === "who") return showWho();
    if (a === "who-close") { $("#who").hidden = true; S.pending = null; return; }
    if (a === "pick-me") return pickMe(el.dataset.name);
    if (a === "copy-http") return copyText(toHttp(EPS[id]), "Request");
    if (a === "copy-text") return copyText(el.dataset.text, "Command");
    if (a === "copy-close") { $("#copybox").hidden = true; return; }
    if (a === "copy-card") { var c = D.newCards[el.dataset.key]; return copyText(c.title + "\nList: " + c.list + "\nStart: " + c.start + "\nDue: " + c.due + "\nLabels: " + c.labels.join(", ") + "\n\n" + c.desc, "Card text"); }
    if (a === "decide") return act.decide(id, el.dataset.v);
    if (a === "ep-area") { S.epArea = el.dataset.v; return renderEndpoints(); }
    if (a === "theme") {
      var dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("wf-theme", document.documentElement.dataset.theme); } catch (e) {}
      return;
    }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.id === "fpkg") { S.f.pkg = el.value; renderBoardList(); }
    else if (el.dataset && el.dataset.act === "move") { if (act.move(el.dataset.id, el.value) === false) { S.sig = null; renderDrawer(); } }
    else if (el.id === "taskPkg") { if (act.move(el.dataset.id, el.value) === false) { S.sig = null; renderDrawer(); } }
    else if (el.id === "pkgOwner") { if (act.setOwner(el.dataset.id, el.value || null) === false) { S.sig = null; renderDrawer(); } }
    else if (el.id === "fsp") { S.f.sprint = el.value; renderBoardList(); }
    else if (el.id === "fwho") { S.f.who = el.value; renderBoardList(); renderSummary(); }
    else if (el.id === "ftier") { S.f.tier = el.value; renderBoardList(); }
    else if (el.id === "assignee") { act.assign(el.dataset.id, el.value); }
    else if (el.dataset && el.dataset.act === "gv-trello") { S.gv.trello = el.checked; renderSchedule(); }
    else if (el.dataset && el.dataset.act === "check") { el.checked = !el.checked; act.check(el.dataset.id, el.dataset.i); }
    else if (el.dataset && el.dataset.act === "trello-flag") { var on = el.checked; el.checked = !on; act.trello(el.dataset.key, on); }
  });
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.id === "fq") { S.f.q = el.value; renderBoardList(); }
    else if (el.id === "epq") { S.epQ = el.value; var l = $("#epList"); if (l) { var q = el.value.toLowerCase(); var list = D.endpoints.filter(function (e) { return (!S.epArea || e.area === S.epArea) && (!q || (e.route + " " + e.name + " " + e.summary).toLowerCase().indexOf(q) >= 0); }); l.innerHTML = list.map(function (e) { return epHTML(e, "tab", false); }).join("") || '<div class="empty"><h3>No endpoint matches</h3></div>'; } }
    else if (el.id === "noteText") { S.draft = el.value; }
    else if (el.id === "pkgName") { S.nameDraft = { id: el.closest("form").dataset.id, v: el.value }; }
  });
  document.addEventListener("submit", function (ev) {
    if (ev.target.id === "noteForm") { ev.preventDefault(); act.note(ev.target.dataset.id, $("#noteText").value); $("#noteText").value = ""; }
    else if (ev.target.id === "renameForm") { ev.preventDefault(); act.renamePkg(ev.target.dataset.id, $("#pkgName").value); }
  });
  document.addEventListener("toggle", function (ev) {
    var d = ev.target;
    if (!d.dataset || !d.dataset.key) return;
    if (d.open) { S.open.add(d.dataset.key); S.open.delete("closed:" + d.dataset.key); } else { S.open.delete(d.dataset.key); S.open.add("closed:" + d.dataset.key); }
  }, true);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if (!$("#copybox").hidden) { $("#copybox").hidden = true; return; }
      if (!$("#who").hidden) { $("#who").hidden = true; S.pending = null; return; }
      if (S.openTask) closeDrawer();
      return;
    }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("article.task")) { ev.preventDefault(); openTask(ev.target.dataset.id); return; }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("article.pkg")) { ev.preventDefault(); openPackage(ev.target.dataset.id); return; }
    if (ev.key === "Tab" && S.openTask) {
      var f = $$("#drawer button, #drawer select, #drawer textarea, #drawer input, #drawer a[href], #drawer summary").filter(function (x) { return !x.disabled && x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (!$("#drawer").contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
      else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });


  /* ---------------------------------------------------------------- drag a card onto another package */
  var dragId = null;
  var clearDrag = function () { $$(".is-drag, .is-over").forEach(function (x) { x.classList.remove("is-drag", "is-over"); }); };
  document.addEventListener("dragstart", function (ev) {
    var li = ev.target.closest ? ev.target.closest("[data-drag]") : null;
    if (!li) return;
    dragId = li.dataset.drag;
    try { ev.dataTransfer.setData("text/plain", dragId); ev.dataTransfer.effectAllowed = "move"; } catch (e) {}
    li.classList.add("is-drag");
  });
  document.addEventListener("dragend", function () { dragId = null; clearDrag(); });
  document.addEventListener("dragover", function (ev) {
    var box = ev.target.closest ? ev.target.closest("[data-pkg]") : null;
    if (!box || !dragId) return;
    ev.preventDefault();
    try { ev.dataTransfer.dropEffect = "move"; } catch (e) {}
    $$(".is-over").forEach(function (x) { if (x !== box) x.classList.remove("is-over"); });
    box.classList.add("is-over");
  });
  document.addEventListener("drop", function (ev) {
    var box = ev.target.closest ? ev.target.closest("[data-pkg]") : null;
    if (!box || !dragId) return;
    ev.preventDefault();
    var id = dragId; dragId = null; clearDrag();
    if (eff(TASKS[id]).pkg !== box.dataset.pkg) act.move(id, box.dataset.pkg);
  });

  /* ---------------------------------------------------------------- start */
  try { var th = localStorage.getItem("wf-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  try { S.hintGone = localStorage.getItem("wf-share-hint") === "1"; } catch (e) {}
  var h = (location.hash || "").replace("#", "");
  if (TABS.some(function (t) { return t.id === h; })) S.tab = h;
  try { var nm = localStorage.getItem("wf-me"); if (nm && D.team.indexOf(nm) >= 0) S.me.name = nm; } catch (e) {}
  S.live = window.claude && window.claude.use ? "loading" : "off";
  renderAll();
  initLive().catch(function () { S.live = "off"; renderAll(); });
})();
</script>
